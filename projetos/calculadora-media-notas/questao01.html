<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculadora de média escolar com HTML, CSS e JavaScript."
    />
    <title>Calculadora de Média | Ricardo Vieira</title>
    <link rel="stylesheet" href="css/questao01.css" />
  </head>
  <body>
    <a class="back-portfolio" href="../../index.html">← Voltar ao portfólio</a>

    <div class="container">
      <h1 id="titulo">Calculadora de Média</h1>

      <form id="form-notas" novalidate>
        <fieldset>
          <legend class="sr-only">Dados do aluno e notas</legend>

          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required />

          <label for="nota1">Nota 1:</label>
          <input
            type="number"
            id="nota1"
            name="nota1"
            placeholder="Digite sua primeira nota"
            min="0"
            max="10"
            step="0.1"
            required
          />

          <label for="nota2">Nota 2:</label>
          <input
            type="number"
            id="nota2"
            name="nota2"
            placeholder="Digite sua segunda nota"
            min="0"
            max="10"
            step="0.1"
            required
          />

          <label for="nota3">Nota 3:</label>
          <input
            type="number"
            id="nota3"
            name="nota3"
            placeholder="Digite sua terceira nota"
            min="0"
            max="10"
            step="0.1"
            required
          />

          <button type="submit">Calcular</button>
        </fieldset>
      </form>

      <div id="resposta" role="status" aria-live="polite"></div>
    </div>

    <script src="js/questao01.js"></script>
  </body>
</html>
